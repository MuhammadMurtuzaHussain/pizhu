# Hosted demo on Render. Uses Gemma via Google AI Studio (Render has no GPUs);
# for private use, run Pīzhù locally with Ollama instead.
services:
  - type: web
    name: pizhu
    runtime: node
    plan: free
    # Render's /usr/bin is read-only, so call pnpm through corepack instead of `corepack enable`.
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: corepack pnpm start
    healthCheckPath: /api/status
    envVars:
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: MODEL_PROVIDER
        value: google
      - key: GOOGLE_MODEL
        value: gemma-4-26b-a4b-it
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: MAX_WORDS
        value: "6000"
      - key: ANALYZE_CONCURRENCY
        value: "3"
